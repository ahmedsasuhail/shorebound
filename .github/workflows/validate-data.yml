name: Validate data

on:
  push:
    paths: ["data/**", ".github/workflows/validate-data.yml"]
  pull_request:
    paths: ["data/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check JSON parses and required fields exist
        run: python scripts/validate_data.py
